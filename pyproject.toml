[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "zodi"
dynamic = ["version"]
description = "Zodiacal and exozodiacal light brightness conventions with a single-source numpy/JAX core"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["array-api-compat>=1.9", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/CoreySpohn/zodi"
Documentation = "https://zodi.readthedocs.io"

[project.optional-dependencies]
jax = ["jax>=0.4.33", "jaxlib>=0.4.33"]
dev = ["pre-commit>=3.5"]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100.2",
    "ineedvalidation>=1.0",
    "pytest-cov>=1.0",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.1.1",
    "pytest-markdown-docs>=0.4.3",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
]
docs = [
    "sphinx>=7.2",
    "myst-nb>=1.0",
    "sphinx-autoapi>=3.0",
    "sphinx-book-theme>=1.1",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zodi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zodi"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "zodi"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["zodi"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# Array namespaces dispatch JAX inputs without importing JAX in the NumPy core.
# The optional extra supplies JAX and its compiled backend for callers.
DEP002 = ["jax", "jaxlib"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/zodi"]

# Verification and validation evidence, collected by the ineedvalidation
# pytest plugin (run with --vv-evidence PATH to write the ledger). Each prefix
# says which physical case a test attests and what kind of evidence it
# produces; explicit @vv.case markers override these defaults.
[tool.ineedvalidation]
library = "zodi"

[tool.ineedvalidation.defaults]
"tests/test_zodi.py" = { case = "local-zodi", evidence = "code-verification" }
"tests/test_tables.py" = { case = "local-zodi", evidence = "code-verification" }
"tests/test_interp.py" = { case = "local-zodi", evidence = "code-verification" }
"tests/test_units.py" = { case = "zodi-units", evidence = "code-verification" }
"tests/test_exozodi.py" = { case = "exozodi-conventions", evidence = "code-verification" }
"tests/test_jax_transforms.py" = { case = "local-zodi", evidence = "code-verification" }
"tests/test_xp_dispatch.py" = { case = "local-zodi", evidence = "code-verification" }
