[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zodi"
version = "0.0.1"
description = "Zodiacal and exozodiacal light brightness conventions with a single-source numpy/JAX core"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["array-api-compat>=1.9", "numpy"]

[project.urls]
Repository = "https://github.com/CoreySpohn/zodi"

[project.optional-dependencies]
jax = ["jax>=0.4.32", "jaxlib>=0.4.32"]
dev = ["pre-commit"]
test = ["pytest", "hypothesis"]
docs = ["myst-nb", "sphinx-autoapi", "sphinx-book-theme"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["src/zodi"]
